name: Test and Publish

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (required for Firebase emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests with Firebase emulator
        run: bun run test:emulator

  publish-npm:
    needs: test # Ensures tests must pass before publishing
    # Only run on push to main (not on PRs)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip-ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to checkout the repository AND push the version commit/tag
      # id-token: write # Uncomment if using OIDC for provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history and tags for version bumping
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Bump version and commit changes
        run: |
          # Stage all changes including build artifacts
          git add .
          # Create version bump commit with all changes
          npm version patch --no-git-tag-version
          git add package.json
          git commit -m "chore(release): v$(node -p "require('./package.json').version") [skip ci]"

      - name: Pull NPM_TOKEN from bodify secrets store
        # The npm token is NOT a per-repo secret — a repo-scoped NPM_TOKEN goes stale silently and every
        # publish then dies on a 404. Pull the canonical token from bodify at publish time, so rotating it
        # in ONE place fixes every repo. Only GitHub secret needed: BODIFY_API_KEY.
        env:
          BODIFY_API_KEY: ${{ secrets.BODIFY_API_KEY }}
        run: |
          TOKEN=$(curl -fsS -H "Authorization: Bearer $BODIFY_API_KEY" \
            "https://bodify.bod.ee/api/apps/9ddba0fb-03bc-4490-8577-5e094b5b6792/env/NPM_TOKEN?environment=prod" \
            | jq -r '.value')
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::could not fetch NPM_TOKEN from bodify"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Publish package to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}

      - name: Create and push tag
        run: |
          git tag "v$(node -p "require('./package.json').version")"
          git push --follow-tags

permissions:
  contents: write

